BI Funds Management Limited is one of India\u2019s leading asset management companies based on quarterly average assets under management (QAAUM) and acts as the investment manager for SBI Mutual Fund. The company operates as a joint venture between State Bank of India and Amundi.\nSBI Mutual Fund offers investment solutions across mutual funds, portfolio management services (PMS), alternative investment funds (AIFs), specialised investment funds (SIFs), and advisory services. Its mutual fund portfolio includes 126 schemes across categories such as equity and equity-oriented funds, debt and debt-hybrid funds, hybrid funds, exchange-traded funds (ETFs), index funds, arbitrage funds, liquid funds, overnight funds, and overseas fund-of-funds.\nAs of December 31, 2025, SBI Funds Management managed mutual fund quarterly average assets under management (QAAUM) of \u20b929.04 lakh crore across these categories. The company served over 16.05 million investors during the same period. As of 2025, the company managed assets of approximately \u20b916.32 lakh crore, representing around 15.5% of India\u2019s total mutual fund industry AUM. At the upper end of the IPO price band, SBI Funds Management has an implied market capitalisation of approximately \u20b91.17 lakh crore.\nSBIFM operates through a pan-India distribution network comprising banks, mutual fund distributors, and independent financial advisors (IFAs). It also provides digital investment access through platforms such as the InvesTap mobile application and SBI\u2019s YONO platform.\nThe company is promoted by State Bank of India, Amundi India Holding, and Amundi Asset Management. The IPO is an offer for sale (OFS), where existing shareholders will sell shares, and the company will not receive any proceeds from the issue."},"companyName":"SBI Funds Management Ltd","companyShortName":"SBI Funds Management","isSme":false,"pros":["The company is the largest asset management company (AMC) in India by mutual fund quarterly average assets under management (QAAUM), with a market share of 15.3% as of March 31, 2026. It is also India\u2019s largest passive asset manager and the largest portfolio management services (PMS) provider, with a 39.7% market share in the PMS segment, according to the CRISIL report.","The company manages a diversified portfolio of investment products across mutual funds, PMS, alternative investment funds (AIFs), specialised investment funds (SIFs), and advisory mandates. As of March 31, 2026, it managed 128 mutual fund schemes serving around 18 million unique investors, reducing dependence on any single scheme or product category.","The company claims to benefit from its joint ownership by State Bank of India (SBI) and Amundi Asset Management. It leverages SBI\u2019s domestic banking network and digital platforms such as YONO, while also accessing Amundi\u2019s global investment expertise and international distribution network across multiple countries.","The company claims to have a pan-India distribution network supported by 132,519 mutual fund distributors, including independent financial advisors, national distributors, and banks. It also has a significant digital presence through its InvesTap application, website, Partner and Mitra platforms, with digital channels accounting for over 94% of its transactions during FY26.","The company is ISO/IEC 27001:2022 certified for its information security management system. It operates a technology infrastructure with hybrid cloud architecture, disaster recovery systems, multi-factor authentication, encryption, and real-time fraud detection to support its digital investment platform.","The company has an investment team of 71 investment professionals with an average tenure of nine years within the company. It follows a team-based investment approach supported by dedicated research teams covering more than 450 companies and over 250 fixed income issuers, along with separate investment processes for equity and fixed income portfolios.","The company has witnessed a consistent increase in its revenue from operations and profit after tax (PAT). Revenue from operations increased from Rs 2,690.55 crore in FY24 to Rs 3,597.76 crore in FY25 and Rs 4,389.49 crore in FY25. PAT increased from Rs 2,072.78 crore in FY24 to Rs 2,540.15 crore in FY25 and Rs 3,067.38 crore in FY26."],"cons":["The company operates in a highly regulated industry and is subject to extensive oversight by SEBI and other regulatory authorities. It has also received administrative warnings, deficiencies, and advisories during SEBI inspections relating to its mutual fund, portfolio management, and registrar operations in recent years, although it claims to have taken corrective measures. Any adverse regulatory changes, future inspection findings, penalties, or restrictions on launching new schemes could negatively impact the company\u2019s business, profitability, and reputation.","The company relies heavily on its distribution network to acquire and retain investors. As of March 31, 2026, its top five distributors accounted for Rs 3,06,899 crore (25.26%) of its mutual fund assets under management (AUM), compared with Rs 2,78,252 crore (26.20%) in 2025 and Rs 2,35,951 crore (25.38%) in 2024. Any deterioration in relationships with key distributors, regulatory changes affecting distributor compensation, or disruptions across its distribution network could adversely impact the company\u2019s AUM growth, revenue, and profitability.","A significant portion of the company\u2019s mutual fund QAAUM is concentrated in a limited number of schemes. As of FY26, the top five schemes accounted for Rs 5,32,535 crore (42.57%) of total mutual fund QAAUM, while the top 10 schemes contributed Rs 7,43,950 crore (59.47%). Any adverse developments affecting these schemes, including weak investment performance, higher investor redemptions, or regulatory actions, could adversely affect the company\u2019s assets under management, revenues and profitability.","The company derives a significant portion of its mutual fund AUM from B-30 cities, which accounted for Rs 277,277 crore (22.82%), Rs 244,709 crore (23.04%), and Rs 201,222 crore (21.64%) as of March 31, 2026, 2025, and 2024, respectively. Investors from these markets may exhibit higher redemption rates during periods of market volatility. Any adverse market conditions, regulatory changes affecting B-30 incentives, or higher-than-expected redemptions from these regions could adversely impact the company\u2019s AUM, revenue, and financial performance.","Passive investment products accounted for Rs 405,526 crore (32.42%), Rs 341,686 crore (31.85%), and Rs 318,201 crore (34.80%) of the company\u2019s mutual fund AUM as of March 31, 2026, 2025, and 2024, respectively. Since passive products generally generate lower management fees than actively managed funds, any significant shift in investor preference towards passive investments could reduce the company\u2019s revenue, profitability, and operating margins.","The company and its promoters are involved in certain ongoing legal proceedings. Any adverse judgment in these matters could adversely affect the company\u2019s business, financial condition, and reputation. ","A significant number of the company\u2019s mutual fund schemes have underperformed their respective benchmarks and peer schemes in recent years. As of FY26, 11 out of 128 schemes (8.59%) with AUM of Rs 94,109 crore (12.69% of ranked AUM) were in the bottom quartile based on three-year returns. Underperformance over the long term could lead to higher investor redemptions and lower AUM, which could negatively impact the company\u2019s reputation and profitability.","The company has contingent liabilities amounting to Rs 176.21 crore as of FY26, compared to Rs 165.60 crore in FY25 and Rs 33.84 crore in FY24. If any of these contingent liabilities materialise, it could adversely affect the company\u2019s financial condition and cash flows.","The company is subject to an outstanding GST demand of Rs 131.93 crore (excluding applicable interest) relating to input tax credit claimed on distribution commissions. Any adverse outcome in this matter could adversely affect the company\u2019s financial condition and results of operations."],"lotSize":26,"minPrice":545,"maxPrice":574,"startDate":"2026-07-14","endDate":"2026-07-16","minBidQty":26,"issueSize":98129100000,"listing":{"listingPrice":null,"listedOn":["BSE"],"bseScripCode":null,"nseScripCode":null},"issuePrice":574,"parentSearchId":null,"subscriptionUpdatedAt":"2026-07-14T18:50:49","documentUrl":"https://www.sbimf.com/docs/default-source/sbi-funds/offer-documents/rhp-document.pdf","logoUrl":"https://assets-netstorage.groww.in/stock-assets/logos2/SBI%20funds%20management.png","videoId":"zrElZu8OZHo","videoName":"https://www.youtube.com/watch?v=zrElZu8OZHo","subscriptionRates":[{"category":"QIB","categoryName":"Qualified Institutional Buyers","subscriptionRate":0.0751013030570184},{"category":"NII","categoryName":"Non-Institutional Investor","subscriptionRate":1.39180211677177},{"category":"RETAIL","categoryName":"Retail Individual Investor","subscriptionRate":0.620688964565172},{"category":"EMPLOYEES","categoryName":"Employees","subscriptionRate":1.0234862911443},{"category":"SHA","categoryName":"Shareholder","subscriptionRate":1.03626167685984},{"category":"TOTAL","categoryName":"Total","subscriptionRate":0.68}],"financials":[{"title":"Revenue","yearly":{"2024":2690.56,"2025":3597.76,"2026":4389.49},"quarterly":{}},{"title":"Total Assets","yearly":{"2024":7106.93,"2025":8771.86,"2026":6420.45},"quarterly":{}},{"title":"Profit","yearly":{"2024":2072.79,"2025":2540.15,"2026":3067.38},"quarterly":{}}],"sector":"Finance","faqs":[{"question":"What is the issue size of SBI Funds Management Ltd IPO?","answer":"The issue size of the SBI Funds Management Ltd IPO is 9812.91 Cr."},{"question":"What is 'pre-apply' for SBI Funds Management Ltd IPO?","answer":"Pre-apply wil
