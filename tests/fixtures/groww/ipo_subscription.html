ogos/ICElectricalscompanyLtd_50580812_97032.png","overallSubscription":378.577946768061,"openingDate":"2026-07-03","closingDate":"2026-07-07","rtaLink":"https://www.skylinerta.com/ipo.php","listingReturn":67.68,"categories":[{"category":"IND_SME","categoryLabel":"Individual investor","categorySubText":"Apply from \u20b92,00,000 onwards.","lotSize":1200,"minBidQuantity":2400,"minPrice":94,"maxPrice":99,"bidCutOffTimestamp":1783439400000}],"subscriptionRates":[{"category":"QIB","categoryName":"Qualified Institutional Buyers","subscriptionRate":234.871895424837},{"category":"NII","categoryName":"Non-Institutional Investor","subscriptionRate":558.480867346939},{"category":"RETAIL","categoryName":"Retail Individual Investor","subscriptionRate":355.431547619048},{"category":"TOTAL","categoryName":"Total","subscriptionRate":378.577946768061}],"subscriptionUpdatedAt":"2026-07-07T16:31:49","issueSize":479100000}],"ipoContent":{"type":"subscription","content":"<p>IPO subscription is the process through which investors apply for shares in an initial public offering, or IPO. It also shows the level of demand for an IPO by comparing the number of shares bid for with the number of shares available. In simple terms, the higher the subscription, the greater the investor interest in the issue.</p>\n<p>For investors, IPO subscription data can be useful because it helps measure demand across different categories such as retail investors, non-institutional investors, and qualified institutional buyers. However, subscription numbers should not be viewed in isolation. A highly subscribed IPO may indicate strong interest, but it does not automatically guarantee allotment or listing gains.</p>\n<h2 data-section-id=\"g64hj3\" data-start=\"1006\" data-end=\"1034\">What Is IPO Subscription?</h2>\n<p data-start=\"1036\" data-end=\"1355\">IPO subscription refers to the process by which investors apply for shares offered by a company during its public issue. When an IPO opens, investors place bids for shares within a specified time window. These bids are collected and counted, and the total demand generated during this period is called IPO subscription.</p>\n<p data-start=\"1357\" data-end=\"1643\">The term is also used to describe how much demand an IPO has received relative to the number of shares available. This is why subscription is usually shown as a multiple such as 1x, 3x, or 10x. A higher multiple means the issue has attracted more demand compared to the shares on offer.</p>\n<p data-start=\"1645\" data-end=\"1857\">For a beginner, the easiest way to understand IPO subscription is to think of it as a demand meter. It shows how many investors want to participate in an IPO and how intense the competition for shares may become.</p>\n<h2 data-section-id=\"e2gkvs\" data-start=\"1859\" data-end=\"1903\">Why IPO Subscription Matters to Investors</h2>\n<p data-start=\"1905\" data-end=\"2234\">IPO subscription matters because it gives investors an early signal about market interest in an issue. Strong demand can suggest that the IPO has attracted attention and confidence from different investor groups. Weak demand, on the other hand, may indicate caution, lower enthusiasm, or concerns around pricing and fundamentals.</p>\n<p data-start=\"2236\" data-end=\"2497\">It also helps investors understand who is driving demand. For example, strong institutional participation may be interpreted differently from strong retail participation. A category-wise view often provides more insight than the total subscription number alone.</p>\n<p data-start=\"2499\" data-end=\"2738\">At the same time, subscription is only one part of the picture. Investors should not treat high demand as a guarantee of a successful investment. Valuation, business quality, industry outlook, and market sentiment remain just as important.</p>\n<h2 data-section-id=\"kfepw2\" data-start=\"2740\" data-end=\"2769\">How IPO Subscription Works</h2>\n<p data-start=\"2771\" data-end=\"2997\">When a company launches an IPO, it opens the issue for bidding for a fixed number of days. During this period, investors can apply for shares through supported channels such as ASBA through banks or broker platforms using UPI.</p>\n<p data-start=\"2999\" data-end=\"3297\">For retail investors, the process usually begins with selecting the IPO, entering the bid details, and approving the mandate. The required amount is generally blocked in the bank account instead of being debited immediately. This allows the application to remain valid until allotment is finalized.</p>\n<p data-start=\"3299\" data-end=\"3596\">As bids are placed, they are collected separately across investor categories. The most common categories are retail individual investors, non-institutional investors, and qualified institutional buyers. In some cases, a separate portion may also be reserved for employees or existing shareholders.</p>\n<p data-start=\"3598\" data-end=\"3909\">Throughout the bidding window, subscription data is updated and published. This allows investors to track how demand is developing across categories. After the issue closes, valid applications are processed and the basis of allotment is finalized. This is the stage where subscription ends and allotment begins.</p>\n<h2 data-section-id=\"1d37y00\" data-start=\"3911\" data-end=\"3951\">IPO Subscription Categories Explained</h2>\n<p data-start=\"3953\" data-end=\"4154\">IPO subscription data is usually broken down into categories because different groups of investors participate in different ways. Understanding these categories makes the data much easier to interpret.</p>\n<h3 data-section-id=\"1l0m3hi\" data-start=\"4156\" data-end=\"4193\">Retail Individual Investors (RII)</h3>\n<p data-start=\"4195\" data-end=\"4475\">This category includes individual investors applying within the retail investment limit. For most new investors, this is the category they belong to. Retail subscription numbers are widely tracked because they show how much interest the IPO has generated among ordinary investors.</p>\n<h3 data-section-id=\"1ldxxbj\" data-start=\"4477\" data-end=\"4518\">Non-Institutional Investors (NII/HNI)</h3>\n<p data-start=\"4520\" data-end=\"4768\">This category includes investors applying above the retail threshold. It may include high-net-worth individuals, corporates, and other non-institutional participants. NII demand is often watched closely because it can be aggressive in popular IPOs.</p>\n<h3 data-section-id=\"1qzwbf7\" data-start=\"4770\" data-end=\"4811\">Qualified Institutional Buyers (QIBs)</h3>\n<p data-start=\"4813\" data-end=\"5071\">QIBs are institutional investors such as mutual funds, banks, insurance companies, and foreign portfolio investors. Strong participation from this group is often viewed as a sign of institutional confidence, although it should still be interpreted carefully.</p>\n<h3 data-section-id=\"1djwj93\" data-start=\"5073\" data-end=\"5108\">Employee and Shareholder Quotas</h3>\n<p data-start=\"5110\" data-end=\"5285\">Some IPOs reserve a portion of shares for employees or existing shareholders of the parent or group company. These segments are smaller but can still matter in certain issues.</p>\n<p data-start=\"5287\" data-end=\"5536\">Category-wise data is important because total subscription can hide the real picture. An IPO may look heavily subscribed overall, but the demand may be concentrated in one segment. A more balanced view comes from looking at each category separately.</p>\n<h2 data-section-id=\"nryxqd\" data-start=\"5538\" data-end=\"5576\">How Is IPO Subscription Calculated?</h2>\n<p data-start=\"5578\" data-end=\"5632\">IPO subscription is calculated using a simple formula:</p>\n<p data-start=\"5634\" data-end=\"5706\">IPO Subscription Ratio = Total Shares Bid For / Total Shares Offered</p>\n<p data-start=\"5708\" data-end=\"5838\">This means the number of shares investors have applied for is divided by the number of shares available in that issue or category.</p>\n<p data-start=\"5840\" data-end=\"6015\">For example, suppose 10 lakh shares are available in the retail portion of an IPO. If investors place bids for 30 lakh shares, the retail portion is subscribed 3 times, or 3x.</p>\n<p data-start=\"6017\" data-end=\"6255\">The same formula can be applied to each investor category as well as the total issue. This is why you may see one IPO showing 2x in retail, 12x in NII, and 18x in QIB at the same time. Each number reflects demand in that specific segment.</p>\n<h2 data-section-id=\"ixvtg2\" data-start=\"6257\" data-end=\"6306\">What Do 1x, 3x, 10x and 50x Subscription Mean?</h2>\n<p data-start=\"6308\" data-end=\"6449\">A 1x subscription means the number of shares bid for is equal to the number of shares offered. In other words, the issue is fully subscribed.</p>\n<p data-start=\"6451\" data-end=\"6598\">A 3x subscription means investors have applied for three times the number of shares available. This indicates solid demand and a competitive issue.</p>\n<p data-start=\"6600\" data-end=\"6762\">A 10x subscription means demand is ten times the available shares. This reflects strong investor interest and usually means allotment becomes much more difficult.</p>\n<p data-start=\"6764\" data-end=\"6926\">A 50x subscription signals extremely heavy demand. Such numbers are often seen in highly anticipated IPOs where investors compete aggressively for limited shares.</p>\n<p data-start=\"6928\" data-end=\"7163\">These multiples are useful for understanding the intensity of demand, but they do not tell the full story. A high multiple does not automatically mean the IPO is attractively priced or that it will deliver strong returns after listing.</p>\n<h2 data-section-id=\"voyx37\" data-start=\"7165\" data-end=\"7206\">Oversubscribed vs Undersubscribed IPOs</h2>\n<p data-start=\"7208\" data-end=\"7503\">An IPO is called oversubscribed when investor demand exceeds the number of shares available. For example, if an issue receives bids for 20 lakh shares against 5 lakh shares offered, it is oversubscribed by 4 times. Oversubscription usually means the IPO has attracted strong market interest.</p>\n<p data-start=\"7505\" data-end=\"7732\">An IPO is called undersubscribed when the bids received are lower than the number of shares offered. This suggests weaker demand. It may raise questions about valuation, timing, business appeal, or general market sentiment.</p>\n<p data-start=\"7734\" data-end=\"8010\">Oversubscription is usually seen as a positive demand signal, but it should not be confused with investment quality. Undersubscription, similarly, should not automatically lead to rejection without checking the company\u2019s fundamentals and pricing. Both situations need context.</p>\n<h2 data-section-id=\"27qnn5\" data-start=\"8012\" data-end=\"8059\">What IPO Subscription Status Tells Investors</h2>\n<p data-start=\"8061\" data-end=\"8291\">IPO subscription status shows how demand is building during the bidding period. It helps investors track whether an issue is receiving weak, moderate, or strong interest and whether demand is rising across the subscription window.</p>\n<p data-start=\"8293\" data-end=\"8555\">The most useful way to read subscription status is category by category. Strong QIB demand may suggest institutional interest. Strong retail demand may reflect broad public enthusiasm. Strong NII demand can sometimes point to aggressive high-value participation.</p>\n<p data-start=\"8557\" data-end=\"8811\">Investors should also remember that subscription often picks up sharply on the last day. Early numbers do not always reflect final demand. A slowly subscribed IPO can see a surge near closing, especially if institutional or large investors step in later.</p>\n<p data-start=\"8813\" data-end=\"9054\">That is why subscription status should be treated as a market signal, not a final verdict. It helps investors understand sentiment, but it should still be read alongside valuation, business fundamentals, risks, and overall market conditions.</p>\n<h2 data-section-id=\"1p7zdjq\" data-start=\"9056\" data-end=\"9124\">IPO Subscription Status vs Application Status vs Allotment Status</h2>\n<p data-start=\"9126\" data-end=\"9198\">These three terms are commonly confused, but they mean different things.</p>\n<p data-start=\"9200\" data-end=\"9411\">Subscription status refers to the overall demand for the IPO. It tells you how many times the issue or a particular category has been bid for. This is a market-wide number, not an individual investor result.</p>\n<p data-start=\"9413\" data-end=\"9593\">Application status refers to your personal IPO application. It tells you whether your bid has been submitted and recorded correctly. It does not mean shares have been allotted.</p>\n<p data-start=\"9595\" data-end=\"9735\">Allotment status is the final result after the IPO closes. It shows whether you actually received shares based on the allotment process.</p>\n<p data-start=\"9737\" data-end=\"9981\">For example, an IPO may be subscribed 20x, your application may be valid and successfully processed, and yet you may receive no allotment. That is because allotment depends on the number of available shares and the competition in your category.</p>\n<p data-start=\"9983\" data-end=\"10073\">Understanding this distinction is important for avoiding confusion during the IPO process.</p>\n<h2 data-section-id=\"1x8h47a\" data-start=\"10075\" data-end=\"10121\">How to Check IPO Subscription Status Online</h2>\n<p data-start=\"10123\" data-end=\"10266\">Investors can check IPO subscription status on broker platforms, exchange pages, and financial market portals that track ongoing public issues.</p>\n<p data-start=\"10268\" data-end=\"10519\">The process is usually simple. First, go to the IPO section of the platform you use. Then select the active IPO you want to track. Once inside, review the total subscription data as well as the category-wise numbers for retail, NII, and QIB investors.</p>\n<p data-start=\"10521\" data-end=\"10735\">While checking the data, focus on more than just the total subscription. Compare category-wise demand and see how the numbers are changing over time. A day-wise view can offer better context than a single snapshot.</p>\n<p data-start=\"10737\" data-end=\"10978\">It is also important to remember that subscription status is different from allotment status. Checking the subscription ratio tells you how the issue is performing overall, but it does not tell you whether you personally will receive shares.</p>\n<h2 data-section-id=\"1j9jhz3\" data-start=\"10980\" data-end=\"11036\">Does High IPO Subscription Improve Allotment Chances?</h2>\n<p data-start=\"11038\" data-end=\"11165\">No, high IPO subscription does not improve allotment chances for an individual investor. In fact, the opposite is usually true.</p>\n<p data-start=\"11167\" data-end=\"11404\">When an IPO is heavily oversubscribed, more investors are competing for the same pool of shares. This makes allotment more difficult, especially in the retail category where valid applications can far exceed the number of available lots.</p>\n<p data-start=\"11406\" data-end=\"11638\">In such cases, the allotment process may be lottery-based or proportionate depending on the category and issue structure. This means a popular IPO may attract huge demand, yet many investors may still walk away without an allotment.</p>\n<p data-start=\"11640\" data-end=\"11766\">So while strong subscription may indicate popularity, it often reduces the probability that any one applicant receives shares.</p>\n<h2 data-section-id=\"104jlg6\" data-start=\"11768\" data-end=\"11822\">Does High IPO Subscription Guarantee Listing Gains?</h2>\n<p data-start=\"11824\" data-end=\"11983\">High IPO subscription does not guarantee listing gains. Strong demand may reflect positive sentiment, but listing performance depends on several other factors.</p>\n<p data-start=\"11985\" data-end=\"12281\">These include the company\u2019s fundamentals, the valuation of the issue, overall market conditions, sector sentiment, and how the IPO has been priced. In some cases, a highly subscribed IPO lists at a premium. In others, expectations may already be too high, leading to disappointment after listing.</p>\n<p data-start=\"12283\" data-end=\"12448\">This is why investors should avoid assuming that demand alone determines returns. Subscription is useful information, but it is not a substitute for proper analysis.</p>\n<h2 data-section-id=\"1imy4y\" data-start=\"12450\" data-end=\"12492\">Factors That Influence IPO Subscription</h2>\n<p data-start=\"12494\" data-end=\"12552\">Several factors influence how much demand an IPO receives.</p>\n<p data-start=\"12554\" data-end=\"12749\">One of the biggest factors is the company itself. Businesses with strong revenue growth, solid profitability, a clear business model, and a compelling growth story often attract greater interest.</p>\n<p data-start=\"12751\" data-end=\"12953\">Valuation also plays a major role. Even a good company may receive limited demand if the IPO is considered expensive. On the other hand, an attractively priced issue may generate stronger participation.</p>\n<p data-start=\"12955\" data-end=\"13134\">Market sentiment matters too. In bullish markets, investors may be more willing to apply for IPOs. Popular sectors can also attract more attention than sectors facing uncertainty.</p>\n<p data-start=\"13136\" data-end=\"13386\">Other factors include institutional participation, brand visibility, issue size, lot size, investor familiarity, and even informal market sentiment around the issue. Together, these elements shape how investors respond during the subscription window.</p>\n<h2 data-section-id=\"gdvzuo\" data-start=\"13388\" data-end=\"13457\">Common Mistakes Investors Make While Reading IPO Subscription Data</h2>\n<p data-start=\"13459\" data-end=\"13638\">A common mistake is focusing only on total subscription and ignoring the category-wise breakup. Total demand may look impressive, but the underlying pattern can be very different.</p>\n<p data-start=\"13640\" data-end=\"13856\">Another mistake is assuming oversubscription guarantees listing gains. Strong demand can signal popularity, but it does not automatically mean the IPO is fairly valued or that post-listing performance will be strong.</p>\n<p data-start=\"13858\" data-end=\"14037\">Many beginners also confuse subscription status with application status and allotment status. These are separate concepts, and misunderstanding them can create false expectations.</p>\n<p data-start=\"14039\" data-end=\"14258\">Some investors also overreact to day-one numbers. Early demand can change quickly, especially on the final day. It is better to read subscription data with patience and context rather than drawing conclusions too early.</p>\n<h2 data-section-id=\"1ogxnnc\" data-start=\"14260\" data-end=\"14287\">IPO Subscription Example</h2>\n<p data-start=\"14289\" data-end=\"14450\">Consider a fictional IPO offering 30 lakh shares in total. Out of these, 10 lakh shares are reserved for retail investors, 8 lakh for NIIs, and 12 lakh for QIBs.</p>\n<p data-start=\"14452\" data-end=\"14623\">Now imagine the retail category receives bids for 25 lakh shares, the NII category receives bids for 64 lakh shares, and the QIB category receives bids for 96 lakh shares.</p>\n<p data-start=\"14625\" data-end=\"14851\">This means the retail portion is subscribed 2.5x, the NII portion is subscribed 8x, and the QIB portion is subscribed 8x. Overall, the IPO has attracted strong demand, but the category-wise picture tells a more detailed story.</p>\n<p data-start=\"14853\" data-end=\"15125\">From this example, an investor can see that demand is broad-based and not limited to one segment. Even so, the data alone is not enough to conclude that the IPO is attractive. The investor still needs to review valuation, fundamentals, risks, and likely allotment chances.</p>\n<h2 data-start=\"14853\" data-end=\"15125\">Conclusion</h2>\n<p>IPO subscription is an important metric because it helps investors understand how much demand an issue is attracting. It shows whether an IPO is receiving weak, moderate, or strong interest and how that interest is distributed across retail, NII, and QIB categories.</p>\n<p>At the same time, subscription data should be interpreted carefully. A highly subscribed IPO may be popular, but that does not mean allotment will be easy or listing gains will be guaranteed.</p>\n<p>The best approach is to use IPO subscription as one input in your decision-making process. Combine it with valuation, fundamentals, risk factors, and allotment mechanics to make a more informed investment decision.</p>","faqs":[{"id":11168,"question":"What is IPO subscription?","answer":"<p>IPO subscription is the process through which investors apply for shares in an IPO. It also refers to the demand for the issue, measured by comparing total shares bid for with total shares offered.</p>"},{"id":11169,"question":"How is IPO subscription calculated?","answer":"<p>IPO subscription is calculated by dividing total shares bid for by total shares offered. If investors bid for 20 lakh shares against 5 lakh shares available, the issue is subscribed 4x.</p>"},{"id":11170,"question":"What does oversubscribed mean in an IPO?","answer":"<p>An IPO is oversubscribed when investor demand is higher than the number of shares available. This means more shares have been applied for than the company has offered.</p>"},{"id":11171,"question":"What does 10x IPO subscription mean?","answer":"<p>A 10x subscription means investors have bid for ten times the number of shares available in that IPO or investor category.</p>"},{"id":11172,"question":"Is IPO subscription the same as allotment?","answer":"<p>No. IPO subscription shows overall demand for the issue, while allotment shows whether shares were actually assigned to an investor after the issue closed.</p>"},{"id":11173,"question":"Does higher IPO subscription increase allotment chances?","answer":"<p>No. Higher IPO subscription usually means more competition for the available shares, which can reduce an individual investor\u2019s chances of allotment.</p>"},{"id":11174,"question":"Does high IPO subscription guarantee listing gains?","answer":"<p>No. High subscription may indicate strong demand, but listing gains depend on many factors including valuation, business quality, pricing, and market sentiment.</p>"},{"id":11175,"question":"How can I check IPO subscription status?","answer":"<p>You can check IPO subscription status on broker platforms, exchange websites, or other market information pages that display ongoing IPO demand and category-wise subscription data.</p>"}]}}},"page":"/ipo/subscription","query":{},"buildId":"Cwz9Y3Oh9QbR-jgvr6uvf","assetPrefix":"//assets-netstorage.groww.in/web-assets/billion_groww_desktop/prod","isFallback":false,"isExperimentalCompile":false,"gip":true,"scriptLoader":[{"nonce":"joUTCtG52KpwEsT2BBWGWNEezdT6McRoo5o7h+ByicM=","strategy":"afterInteractive","id":"_webengage_script_tag","dangerouslySetInnerHTML":{"__html":" var webengage;!function(w,e,b,n,g){function o(e,t){e[t[t.length-1]]=function(){r.__queue.push([t.join(\".\"),\n          arguments])}}var i,s,r=w[b],z=\" \",l=\"init options track screen onReady\".split(z),a=\"feedback survey notification\".split(z),c=\"options render clear abort\".split(z),p=\"Open Close Submit Complete View Click\".split(z),u=\"identify login logout setAttribute\".split(z);if(!r||!r.__v){for(w[b]=r={__queue:[],__v:\"6.0\",user:{}},i=0;i < l.length;i++)o(r,[l[i]]);for(i=0;i < a.length;i++){for(r[a[i]]={},s=0;s < c.length;s++)o(r[a[i]],[a[i],c[s]]);for(s=0;s < p.length;s++)o(r[a[i]],[a[i],\"on\"+p[s]])}for(i=0;i < u.length;i++)o(r.user,[\"user\",u[i]]);setTimeout(function(){var f=e.createElement(\"script\"),d=e.getElementById(\"_webengage_script_ta
