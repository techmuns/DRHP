name: Daily DRHP/IPO Monitor

# Runs the data pipeline every day, commits the refreshed data + snapshot to main,
# and lets the connected Cloudflare Pages project redeploy the dashboard automatically.
#
# Triggers:
#   * schedule  — every day at 03:00 UTC (08:30 IST), covering the prior 7 days
#   * manual    — "Run workflow" button, with an optional run-date override
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date YYYY-MM-DD (blank = today)"
        required: false
        default: ""

# Allow the job to push the refreshed data back to the repository.
permissions:
  contents: write

# Never let two runs commit on top of each other.
concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main         # always build from & push to main (the deployed branch),
          fetch-depth: 0     # regardless of which branch triggered the run — and full
                             # history so the rebase-retry below can find a merge base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            python -m drhp_pipeline.pipeline --run-date "${{ github.event.inputs.run_date }}"
          else
            python -m drhp_pipeline.pipeline
          fi
        env:
          PYTHONPATH: src

      - name: Commit and push refreshed data
        run: |
          git config user.name  "drhp-monitor-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes this run — nothing to commit."
            exit 0
          fi
          git commit -m "data: daily DRHP/IPO monitor refresh ($(date -u +%Y-%m-%d))"
          # Push to main, self-healing against a concurrent update: if the push is
          # rejected because main moved on, rebase our single data commit onto the
          # latest main and retry rather than failing the whole run.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest main and retrying."
            git fetch origin main
            git rebase origin/main || { echo "Rebase hit a conflict — aborting."; git rebase --abort; exit 1; }
          done
          echo "Could not push after 5 attempts."
          exit 1
